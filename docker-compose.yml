x-app-info: &app-info
  build:
    context: .
    dockerfile: Dockerfile
  env_file: .env
  networks:
    - proxy
  tty: true
  init: true
x-service-info: &service-info
  restart: always
  networks:
    - proxy
  logging:
    options:
      max-size: 50m
      max-file: '10'
  init: true

services:
  app:
    <<: *app-info
    container_name: "${APP_NAME}"
    ports:
      - "${APP_EXPOSE_PORT}:5555"
    volumes:
      - "${PROJECT_PATH}:${APP_ROOT}"
      - "${PROJECT_SECRET_PATH}:${APP_SECRET_PATH}"
    restart: always
    command: 'gunicorn -c wsgi.py main:app'
    tty: false
    logging:
      options:
        max-size: 50m
        max-file: '10'
  app_build:
    <<: *app-info
    container_name: "${APP_NAME}_build"
    volumes:
      - "${PROJECT_PATH}:${APP_ROOT}"
      - "${PROJECT_SECRET_PATH}:${APP_SECRET_PATH}"
    restart: always
    environment:
      - FLASK_APP=flasky.py
    tty: false
    logging:
      options:
        max-size: 50m
        max-file: '10'
  postgres:
    <<: *service-info
    image: "${POSTGRES_IMAGE}"
    container_name: "${POSTGRES_CONTAINER_NAME}"
    ports:
      - "${POSTGRES_EXPOSE_PORT}:${POSTGRES_PORT}"
    volumes:
      - "${DB_PATH}/postgres:/var/lib/postgresql/data"
    environment:
      POSTGRES_USER: "${POSTGRES_ADMIN}"
      POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASS}"
      POSTGRES_DB: "${DB_NAME}"
  redis:
    <<: *service-info
    image: "${REDIS_IMAGE}"
    container_name: "${REDIS_CONTAINER_NAME}"
    ports:
      - "${REDIS_EXPOSE_PORT}:${REDIS_PORT}"
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - "${DB_PATH}/redis:/data"
      - "${PROJECT_CONFIG_PATH}/redis:/usr/local/etc/redis"
networks:
  proxy:
    name: "${SYSTEM_NAME}"
